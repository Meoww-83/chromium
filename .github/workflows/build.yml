name: build

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure RDP
        shell: powershell
        run: |
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" `
            -Value 0 `
            -Force

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "UserAuthentication" `
            -Value 0 `
            -Force

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "SecurityLayer" `
            -Value 0 `
            -Force

          netsh advfirewall firewall delete rule name="RDP-Tailscale"

          netsh advfirewall firewall add rule `
            name="RDP-Tailscale" `
            dir=in `
            action=allow `
            protocol=TCP `
            localport=3389

          Restart-Service -Name TermService -Force

      - name: Install Dependencies and Prepare Script
        shell: powershell
        env:
          JS_SCRIPT_BASE64: ${{ secrets.JS_SCRIPT_BASE64 }}
          TARGET_LINK: ${{ secrets.TARGET_LINK }}
        run: |
          Write-Host "Installing Puppeteer..."

          npm install puppeteer puppeteer-core

          Write-Host "Writing target link..."

          Set-Content `
            -Path "link.txt" `
            -Value $env:TARGET_LINK `
            -NoNewline

          Write-Host "Decoding JavaScript script..."

          if ([string]::IsNullOrWhiteSpace($env:JS_SCRIPT_BASE64)) {
            Write-Error "JS_SCRIPT_BASE64 secret is empty."
            exit 1
          }

          $bytes = [System.Convert]::FromBase64String($env:JS_SCRIPT_BASE64)

          $decodedScript = [System.Text.Encoding]::UTF8.GetString($bytes)

          Set-Content `
            -Path "v77.cjs" `
            -Value $decodedScript `
            -Encoding UTF8

          Write-Host "Script created: v77.cjs"

      - name: Run JS
        shell: powershell
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          Write-Host "Starting Node.js script..."
          node v77.cjs

      - name: Show Progress
        if: always()
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "Workflow execution finished."
